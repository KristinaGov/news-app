# Sources for the daily briefing. Edit freely; the daily job reads this file on every run.
# SOURCES.md lists every source in plain words and says how each one is collected.
#
# feeds:           RSS/Atom feeds, read directly without AI (all checked on 2026-11-18).
#   keywords: true   -> broad feed; keep only entries matching the category keywords.
# pages:           sources without a feed. Their news page is read directly without AI;
#                  "links" is the pattern a link must match to count as a news item.
# search_topics:   questions a model searches the web for, to catch stories the feeds
#                  missed. One search per topic, about $0.007 each. Rewrite these to
#                  match what you follow; specific topics find better stories.
# max_searches:    cap on web searches per category per search day. 0 turns search off.

# AI models, by their OpenRouter names (https://openrouter.ai/models). Each list is tried
# in order: the second model is used only if the first fails. Chosen on 2026-11-18 by
# price among models that support the features the job needs.
#   summary: translates, merges, summarises and rates. Needs "structured outputs".
#   search:  runs the web searches. Needs "tools".
#   reasoning: how much the model thinks before answering (none, low, high). Thinking is
#              billed as output, so keep it low.
models:
  summary: ["anthropic/claude-haiku-5.5", "openai/gpt-6-luna"]
  search: ["openai/gpt-6-luna", "anthropic/claude-haiku-5.5"]
  reasoning: low

# AI web search runs only on these weekdays (0 = Monday ... 6 = Sunday) and looks back
# lookback_days. Feeds and pages are read every day regardless.
search:
  weekdays: [0, 3, 6]
  lookback_days: 4

# EU legislation tracker, shown in the EU tab under "Legislation". No AI is used: the
# job reads the European Parliament's Legislative Observatory, which holds the same
# procedures as the Legislative Train. A file is tracked when its title matches a keyword.
legislation:
  enabled: true
  category: eu
  since_year: 2024          # ignore procedures opened before this year
  procedure_types: [COD]    # COD = ordinary legislative procedure
  recheck_days: 3           # how often an unfinished file's status is looked up again
  max_checks: 40            # most status lookups per run
  keywords: [energy, climate, emission, ets, carbon, electricity, gas, hydrogen,
             renewable, nuclear, environment, grid, methane, cbam, net-zero, decarbon,
             fuel, pollut, waste, water, nature, biodivers, chemical, batter, co2,
             circular, deforest, forest, soil, air quality, heating, cooling]

categories:
  - id: eu
    name: EU
    description: >
      European Commission energy and environment publications (studies, laws, white
      papers, decrees, consultations) and the EU Emissions Trading System (EU ETS).
    keywords: [energy, climate, emission, ets, carbon, electricity, gas, hydrogen,
               renewable, nuclear, environment, grid, methane, cbam, green deal,
               net-zero, decarbon, fuel, pollution]
    feeds:
      - {name: "EC DG Energy", url: "https://energy.ec.europa.eu/node/2/rss_en"}
      - {name: "EC DG Climate Action", url: "https://climate.ec.europa.eu/node/2/rss_en"}
      - {name: "EC DG Environment", url: "https://environment.ec.europa.eu/node/92/rss_en"}
      - {name: "EC Joint Research Centre", url: "https://joint-research-centre.ec.europa.eu/node/2/rss_en", keywords: true}
      - {name: "EC Press Corner", url: "https://ec.europa.eu/commission/presscorner/api/rss?language=en", keywords: true}
      - {name: "EUR-Lex Official Journal L", url: "https://eur-lex.europa.eu/EN/display-feed.rss?rssId=222", keywords: true}
      - {name: "EUR-Lex Commission proposals", url: "https://eur-lex.europa.eu/EN/display-feed.rss?rssId=161", keywords: true}
      - {name: "European Environment Agency", url: "https://www.eea.europa.eu/en/newsroom/rss.xml"}
      - {name: "ACER", url: "https://www.acer.europa.eu/rss.xml"}
      - {name: "ENTSO-E", url: "https://www.entsoe.eu/rss/news.xml"}
      - {name: "Carbon Pulse", url: "https://carbon-pulse.com/feed/"}
      - {name: "Euractiv", url: "https://www.euractiv.com/feed/", keywords: true}
      - {name: "Politico Europe Energy", url: "https://www.politico.eu/section/energy/feed/"}
      - {name: "E3G", url: "https://www.e3g.org/feed/", keywords: true}
      - {name: "Florence School of Regulation", url: "https://fsr.eui.eu/feed/", keywords: true}
      - {name: "Sandbag", url: "https://sandbag.be/feed/"}
    search_topics:
      - "EU energy policy this week: decisions and agreements by the Commission, Council or Parliament on electricity, gas, grids, renewables or nuclear"
      - "EU ETS, ETS2 and CBAM this week: reforms, political disputes, price moves"
      - "European energy companies and markets this week: major deals, investments, power and gas price developments"
    max_searches: 3

  - id: de
